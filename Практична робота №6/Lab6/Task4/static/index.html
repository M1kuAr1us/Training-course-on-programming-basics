<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Чат у реальному часі</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div id="chat-container">
        <h1>Чат</h1>
        <input id="username" type="text" placeholder="Ваш нікнейм">
        <div id="messages"></div>
        <input id="messageInput" type="text" placeholder="Ваше повідомлення...">
        <button onclick="sendMessage()">Надіслати</button>
    </div>

    <script>
        let ws;

        function connectWebSocket() {
            ws = new WebSocket(`ws://${location.host}/ws/chat`);

            ws.onopen = () => {
                console.log("Connected to chat server");
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                addMessage(data.username, data.message, data.timestamp);
            };

            ws.onclose = () => {
                console.log("Disconnected. Trying to reconnect...");
                setTimeout(connectWebSocket, 1000);
            };

            ws.onerror = (err) => {
                console.error("WebSocket error", err);
                ws.close();
            };
        }

        function addMessage(username, message, timestamp) {
            const messages = document.getElementById("messages");
            const messageElement = document.createElement("div");
            messageElement.className = "message";
            messageElement.innerHTML = `<strong>${username}</strong> [${timestamp}]: ${message}`;
            messages.appendChild(messageElement);
            messages.scrollTop = messages.scrollHeight;
        }

        function sendMessage() {
            const username = document.getElementById("username").value.trim();
            const messageInput = document.getElementById("messageInput");
            const message = messageInput.value.trim();
            if (username && message && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ username, message }));
                messageInput.value = "";
            }
        }

        async function loadHistory() {
            const response = await fetch("/history");
            const history = await response.json();
            history.forEach(msg => addMessage(msg.username, msg.message, msg.timestamp));
        }

        window.onload = () => {
            connectWebSocket();
            loadHistory();
        };
    </script>
</body>
</html>
